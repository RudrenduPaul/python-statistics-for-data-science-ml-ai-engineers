<script>
document.addEventListener("DOMContentLoaded", function () {
  var tools = document.querySelector(".sidebar-title .sidebar-tools-main");
  if (tools && !document.querySelector(".sidebar-byline")) {
    var byline = document.createElement("div");
    byline.className = "sidebar-byline";
    var link = document.createElement("a");
    link.href = "https://github.com/RudrenduPaul";
    link.textContent = "by Rudrendu Paul";
    byline.appendChild(link);
    tools.insertAdjacentElement("afterend", byline);
  }
});
</script>
